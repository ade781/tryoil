<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrikeZone Pancing — Manajemen Inventaris Toko Pancing</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <svg class="brand-logo" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="pancingLogoGrad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#0d9488" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="url(#pancingLogoGrad)" />
          <path d="M22 9V22.5C22 25.5376 19.5376 28 16.5 28C13.4624 28 11 25.5376 11 22.5V20.5L14 22.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="22" cy="9" r="2" fill="#ffffff" />
          <path d="M8 31.5C11 29.5 14 29.5 17 31.5C20 33.5 23 33.5 26 31.5C28.5 29.8 30.5 29.8 32 31" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
        </svg>
        <div class="brand-text">
          <h1 class="brand-name">StrikeZone Pancing</h1>
          <p class="brand-subtitle">Manajemen Inventaris Perlengkapan Mancing</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" id="addProductBtn" class="btn btn-primary">
          + Tambah Produk
        </button>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="kpi-strip" aria-label="Ringkasan Inventaris">
      <article class="kpi-card">
        <span class="kpi-label">Total Produk</span>
        <strong class="kpi-value" id="kpiTotalProducts">0</strong>
      </article>
      <article class="kpi-card">
        <span class="kpi-label">Total Stok</span>
        <strong class="kpi-value" id="kpiTotalStock">0</strong>
      </article>
      <article class="kpi-card">
        <span class="kpi-label">Nilai Inventaris</span>
        <strong class="kpi-value" id="kpiInventoryValue">Rp 0</strong>
      </article>
      <article class="kpi-card kpi-status">
        <span class="kpi-label">Status Basis Data</span>
        <span class="status-badge" id="dbStatusBadge">Memeriksa...</span>
      </article>
    </section>

    <section class="toolbar" aria-label="Filter dan Pencarian Produk">
      <div class="filter-group" role="group" aria-label="Filter Kategori">
        <button type="button" class="filter-btn active" data-category="all">Semua</button>
        <button type="button" class="filter-btn" data-category="Joran">Joran</button>
        <button type="button" class="filter-btn" data-category="Reel">Reel</button>
        <button type="button" class="filter-btn" data-category="Senar">Senar</button>
        <button type="button" class="filter-btn" data-category="Umpan">Umpan</button>
        <button type="button" class="filter-btn" data-category="Aksesoris">Aksesoris</button>
      </div>

      <div class="search-box">
        <label for="searchInput" class="sr-only">Cari produk</label>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Cari nama produk, merek, atau deskripsi..."
          autocomplete="off"
        >
      </div>
    </section>

    <section class="catalog-section" aria-label="Daftar Produk">
      <div id="productList" class="product-list"></div>

      <div id="emptyState" class="empty-state" hidden>
        <p class="empty-title">Belum ada produk ditemukan</p>
        <p class="empty-desc">Ubah kata kunci pencarian, pilih kategori lain, atau tambahkan produk baru.</p>
      </div>
    </section>
  </main>

  <div id="productModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Tambah Produk</h2>
        <button type="button" id="closeModalBtn" class="modal-close" aria-label="Tutup modal">&times;</button>
      </div>

      <form id="productForm" class="modal-form">
        <input type="hidden" id="productId" name="id">

        <div class="form-group">
          <label for="prodName">Nama Produk <span class="required">*</span></label>
          <input type="text" id="prodName" name="name" placeholder="Contoh: Joran Spinning Carbon 180cm" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prodCategory">Kategori <span class="required">*</span></label>
            <select id="prodCategory" name="category" required>
              <option value="Joran">Joran</option>
              <option value="Reel">Reel</option>
              <option value="Senar">Senar</option>
              <option value="Umpan">Umpan</option>
              <option value="Aksesoris">Aksesoris</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prodBrand">Merek <span class="required">*</span></label>
            <input type="text" id="prodBrand" name="brand" placeholder="Contoh: Shimano, Daiwa, Maguro" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prodPrice">Harga (Rp) <span class="required">*</span></label>
            <input type="number" id="prodPrice" name="price" min="0" step="100" placeholder="0" required>
          </div>

          <div class="form-group">
            <label for="prodStock">Stok <span class="required">*</span></label>
            <input type="number" id="prodStock" name="stock" min="0" step="1" placeholder="0" required>
          </div>
        </div>

        <div class="form-group">
          <label for="prodDesc">Deskripsi</label>
          <textarea id="prodDesc" name="description" rows="3" placeholder="Spesifikasi singkat, ukuran, atau catatan produk..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Batal</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Simpan Produk</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
